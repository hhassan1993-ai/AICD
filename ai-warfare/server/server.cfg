# =============================================================================
# ai-warfare / server/server.cfg
# FXServer config for the AI-army mission engine (Launch Plan v2.0, M1/M2).
# Reference: docs/ENGINE-SPEC.md §2, §4, §7.
#
# WORKING-DIRECTORY / +exec LAYOUT (see README.md for the full explanation):
#   FXServer is started with its working directory set to the ai-warfare/
#   REPO ROOT (not server/, not server/data/), and this file is loaded with
#   a path relative to that root:
#       +exec server/server.cfg
#   This lets a single `resources/` folder at the repo root serve both the
#   mission resources under resources/[mission]/ (owned by the Lua worker,
#   untouched by this file) AND the standard cfx-server-data resources
#   (mapmanager, chat, spawnmanager, sessionmanager, basic-gamemode,
#   hardcap), which get-server.ps1 copies into resources/ alongside
#   resources/[mission]/ after cloning cfx-server-data into server/data/.
#   FXServer only ever scans ONE `resources/` directory relative to its
#   working directory, so this repo intentionally keeps that single
#   resources/ folder at the repo root rather than under server/data/.
# =============================================================================

# --- Network endpoints ---
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# --- Core sync / capacity ---
set onesync on
sv_maxclients 8

# --- Game build enforcement ---
# Left disabled by default: pin only if you hit build-specific desync issues
# or need a specific game build for a required native/feature. Example:
#   sv_enforceGameBuild 2944
# sv_enforceGameBuild 2944

# --- License key ---
# Free key: generate one at https://portal.cfx.re (Keymaster -> create a key
# for this server). Do NOT commit a real key here. The value below is a
# placeholder; restart-and-check.ps1 / restart-and-check.sh override it at
# launch via `+set sv_licenseKey %FIVEM_LICENSE_KEY%` (or $env:FIVEM_LICENSE_KEY),
# which is passed on the command line AFTER +exec so it wins over this line.
sv_licenseKey "CHANGEME"

# --- Identity ---
sv_hostname "AI-Army Mission Engine — TEST (M1/M2)"
sets tags "aiwarfare, test, onesync"
sets sv_projectName "ai-warfare"
sets sv_projectDesc "Self-hosted mission-engine test server (Launch Plan v2.0 M1/M2)"

# --- Security ---
sv_scriptHookAllowed 0

# --- Master server listing ---
# Keep this test server OFF the public server list while iterating. Leaving
# sv_master1 unset (or set to "") means FXServer will not announce this
# server to the public master list / server browser. Only uncomment and
# point it elsewhere if you deliberately want to list it.
# sv_master1 ""

# --- Standard cfx-server-data resource set (from citizenfx/cfx-server-data) ---
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap

# --- Mission resources (owned by the Lua worker; do not edit their content) ---
ensure mission-shared
ensure mission-core
ensure mission-ai
ensure population-ctl

# --- Permissions ---
# Grant the admin group every mo_* control command, /coords (the coord
# dumper), and the /test_* validation commands from ENGINE-SPEC.md §4/§7.
add_ace group.admin command.mo_spawn allow
add_ace group.admin command.mo_engage allow
add_ace group.admin command.mo_move allow
add_ace group.admin command.mo_amove allow
add_ace group.admin command.mo_hold allow
add_ace group.admin command.mo_retreat allow
add_ace group.admin command.mo_status allow
add_ace group.admin command.mo_clear allow
add_ace group.admin command.coords allow
add_ace group.admin command.test_m1 allow
add_ace group.admin command.test_pool allow

# Add yourself to the admin group. Replace CHANGEME with your FiveM identifier,
# found by connecting once and running `/`... or checking the server console
# log line "player has identifiers: [...]" on connect, e.g.:
#   fivem:1234567
# then:
#   add_principal identifier.fivem:CHANGEME group.admin
add_principal identifier.fivem:CHANGEME group.admin
